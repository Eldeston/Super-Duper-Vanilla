name: Release & Tagging

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (if triggering manually)'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'patch'
          - 'minor'
          - 'major'
      custom_version:
        description: 'Explicit custom version (optional, e.g. 1.0.1)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Check Version & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install glslangValidator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Handle Version Bump (workflow_dispatch only)
        id: manual_bump
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.bump != 'none' || github.event.inputs.custom_version != '')
        run: |
          TARGET="${{ github.event.inputs.custom_version }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ github.event.inputs.bump }}"
          fi
          python3 scripts/bump_version.py "$TARGET" --commit --tag --push

      - name: Detect Version Bump and Tags
        id: check_bump
        run: |
          python3 scripts/check_version_bump.py --create-tag

      - name: Run Quality Gate Pipeline
        run: task gate

      - name: Package Shaderpack ZIP
        if: steps.check_bump.outputs.should_release == 'true'
        run: task build

      - name: Verify Release Artifact Exists
        if: steps.check_bump.outputs.should_release == 'true'
        id: verify_artifact
        run: |
          ZIP_NAME="Hyper-Duper-Vanilla.${{ steps.check_bump.outputs.tag }}.zip"
          if [ ! -f "dist/$ZIP_NAME" ]; then
            echo "Expected dist/$ZIP_NAME not found. Available dist files:"
            ls -la dist/
            exit 1
          fi
          echo "Found release archive: dist/$ZIP_NAME"

      - name: Create or Update GitHub Release
        if: steps.check_bump.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_bump.outputs.tag }}
          name: HyperDuper Vanilla ${{ steps.check_bump.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Hyper-Duper-Vanilla.${{ steps.check_bump.outputs.tag }}.zip
            dist/Hyper-Duper-Vanilla.${{ steps.check_bump.outputs.tag }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts to Workflow Run
        if: steps.check_bump.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hyper-Duper-Vanilla-${{ steps.check_bump.outputs.tag }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
