## Entity ids are kept apart from block ids (20000 and above) so replacing one never touches the other
## Entity ids should not be duplicated even in other entity ids
## Vanilla entities first, then modded entities grouped by mod (modded lists from Euphoria Patches, MIT licensed, thanks SpacEagle)
## Entity ids without assigned entities are for user inputs
## Maximum entity id is capped at 32767

