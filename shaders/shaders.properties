## Profiles
profile.POTATO = \
    ANTI_ALIASING:1 !SHARPEN_FILTER !BLOOM \
    !SHADOW_MAPPING !SHADOW_COLOR !SHADOW_FILTER !SSAO \
    !SSR !ROUGH_REFLECTIONS !PREVIOUS_FRAME \
    !VOLUMETRIC_LIGHTING CLOUD_TYPE:0 \
    PBR_MODE:0

profile.LOW = \
    profile.POTATO \
    BLOOM \
    SHADOW_MAPPING shadowMapResolution:512 UNDERWATER_CAUSTICS:0 \
    SSR RAYTRACER_STEPS:8 RAYTRACER_BISTEPS:2 \
    CLOUD_TYPE:1 \
    PBR_MODE:1
    
profile.MEDIUM = \
    profile.LOW \
    ANTI_ALIASING:2 \
    SHADOW_COLOR SHADOW_FILTER shadowMapResolution:1024 UNDERWATER_CAUSTICS:1 SSAO \
    RAYTRACER_STEPS:16 RAYTRACER_BISTEPS:4 ROUGH_REFLECTIONS PREVIOUS_FRAME \
    VOLUMETRIC_LIGHTING

profile.HIGH = \
    profile.MEDIUM \
    shadowMapResolution:2048 \
    RAYTRACER_STEPS:32 \
    PBR_MODE:2

profile.ULTRA = \
    profile.HIGH \
    SHARPEN_FILTER \
    shadowMapResolution:4096 UNDERWATER_CAUSTICS:2 \
    RAYTRACER_STEPS:64

