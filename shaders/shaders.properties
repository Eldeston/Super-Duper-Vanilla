## Set shader settings
    vignette = false
    separateAo = true
    oldLighting = false
    underwaterOverlay = false

    rain.depth = false
    shadow.culling = true
    frustum.culling = true
    beacon.beam.depth = true

    ## Iris Exclusives
        sky = false
        stars = false

        occlusion.culling = true
        ## Makes sure particles are rendered after deferred
        particles.ordering = after
        ## NOTE: Despite having separateEntityDraws, gbuffers_entities_translucent and gbuffers_block_translucent is unused
        ## IMS made gbuffers_entities_translucent and gbuffers_block_translucent as a scam :C
        separateEntityDraws = true

    ## Mod Exclusives
        dhClouds = off
        dhShadow.enabled = false

    #if SUN_MOON_TYPE != 2
        sun = false
        moon = false
    #endif

    #ifndef BLOCK_ENTITY_SHADOWS
        shadowBlockEntities = false
    #endif

    ## TO DO: need to separate the 2 options
    #ifndef ENTITY_SHADOWS
        shadowEntities = false

        ## Iris Exclusives
            shadowPlayer = true
    #endif

