## Position uniforms
    uniform.vec3.camPosDelta = vec3(cameraPosition.x - previousCameraPosition.x, cameraPosition.y - previousCameraPosition.y, cameraPosition.z - previousCameraPosition.z)

## Mod Exclusives uniforms
    #ifdef DISTANT_HORIZONS
        uniform.float.borderFar = if(isEyeInWater == 0, dhRenderDistance, far)
    #else
        #ifdef VOXY
            uniform.float.borderFar = if(isEyeInWater == 0, vxRenderDistance, far)
        #else
            uniform.float.borderFar = far
        #endif
    #endif

## Custom time uniforms
    ## Apparently using the macro conditional "else if" does not work here so I improvised
    #if TIMELAPSE_MODE == 2
        uniform.float.vertexFrameTime = smooth(worldTime / 24, 30)
        uniform.float.fragmentFrameTime = vertexFrameTime
    #endif

    #if TIMELAPSE_MODE == 1
        uniform.float.vertexFrameTime = frameTimeCounter
        uniform.float.fragmentFrameTime = smooth(worldTime / 24, 30)
    #endif

    #if TIMELAPSE_MODE == 0
        uniform.float.vertexFrameTime = frameTimeCounter
        uniform.float.fragmentFrameTime = frameTimeCounter
    #endif

## Custom day cycle uniforms
    #if TIMELAPSE_MODE != 0
        variable.float.newSunAngle = smooth(sunAngle, 30) * pi * 2
    #endif
    #if TIMELAPSE_MODE == 0
        variable.float.newSunAngle = sunAngle * pi * 2
    #endif


    uniform.float.celestialSinX = sin(newSunAngle)

    variable.float.absCelestialSinX = abs(celestialSinX)

    ## Smooth shadow fade calculation (zeros out near horizon crossing to hide shadowModelView flip)
    variable.float.shdFadeRaw = clamp((absCelestialSinX - 0.02) * 5.55555556, 0, 1)
    uniform.float.shdFade = shdFadeRaw * shdFadeRaw * (3 - 2 * shdFadeRaw)

    uniform.float.dayCycle = 1 + celestialSinX
    variable.float.dayCycleAdjustRaw = clamp(dayCycle - 0.5, 0, 1)
    uniform.float.dayCycleAdjust = dayCycleAdjustRaw * dayCycleAdjustRaw * (3 - 2 * dayCycleAdjustRaw)

    uniform.float.twilightPhase = absCelestialSinX * absCelestialSinX * (3 - 2 * absCelestialSinX)

    ## Smooth celestial power calculation (diminishes sun power to 0 at horizon before switching to moon and back)
    variable.float.sunPowerRaw = clamp(celestialSinX * 6.66666667, 0, 1)
    uniform.float.sunPower = sunPowerRaw * sunPowerRaw * (3 - 2 * sunPowerRaw)

    variable.float.moonPowerRaw = clamp(-celestialSinX * 6.66666667, 0, 1)
    uniform.float.moonPower = moonPowerRaw * moonPowerRaw * (3 - 2 * moonPowerRaw)

## Environment detection
    uniform.float.isPrecipitationRain = smooth(if(in(biome_precipitation, 1) && cameraPosition.y < 96, 1, 0), 15) * wetness

## Dynamic Weather and Overcast System
    #ifdef DYNAMIC_WEATHER
        variable.int.cycleDay = worldDay % 1024
        variable.float.weatherTime = cycleDay * 2.0 + worldTime * 0.000083333333
        variable.float.weatherH1 = sin(weatherTime * 1.0 + 1.7) * 0.44
        variable.float.weatherH2 = sin(weatherTime * 2.236 + 4.1) * 0.28
        variable.float.weatherH3 = sin(weatherTime * 0.447 + 0.9) * 0.18
        variable.float.weatherH4 = sin(weatherTime * 3.605 + 2.3) * 0.10
        variable.float.weatherRaw = weatherH1 + weatherH2 + weatherH3 + weatherH4
        variable.float.weatherLinear = clamp(weatherRaw * 2.4 + 0.48, 0, 1)
        variable.float.weatherShaped = weatherLinear * weatherLinear * (3 - 2 * weatherLinear)
        variable.float.weatherTarget = clamp(weatherShaped + rainStrength * (0.60 + weatherShaped * 0.40), 0, 1)
        uniform.float.overcastIntensity = smooth(weatherTarget, 15, 20)
        uniform.float.weatherFade = overcastIntensity
    #else
        uniform.float.overcastIntensity = smooth(rainStrength, 8, 30)
        uniform.float.weatherFade = overcastIntensity
    #endif

## Dynamic Fog System (humidity-based biome probabilities following dynamic weather)
    #ifdef DYNAMIC_FOG
        variable.float.isAridBiome = if(in(biome_category, 4, 6, 12) || in(biome_precipitation, 0), 1, 0)
        variable.float.isWetBiome = if(in(biome_category, 3, 11, 13, 14), 1, 0)
        variable.float.biomeHumidity = clamp(if(isAridBiome > 0.5 && isWetBiome < 0.5, 0.0, max(rainfall, if(isWetBiome > 0.5, 0.95, 0.0))), 0, 1)
        uniform.float.smoothHumidity = smooth(biomeHumidity, 25)

        #ifdef DYNAMIC_WEATHER
            variable.float.fogWave1 = sin(weatherTime * 1.414 + 2.8) * 0.42
            variable.float.fogWave2 = sin(weatherTime * 2.718 + 0.5) * 0.28
            variable.float.fogWave3 = sin(weatherTime * 0.577 + 4.2) * 0.18
            variable.float.fogWave4 = sin(weatherTime * 4.123 + 1.9) * 0.12
            variable.float.fogWeatherWave = fogWave1 + fogWave2 + fogWave3 + fogWave4
            variable.float.weatherMoisture = clamp(fogWeatherWave * 1.5 + 0.20 + weatherTarget * 0.70 + rainStrength * 0.50, 0, 1)
        #else
            variable.float.weatherMoisture = clamp(rainStrength * 0.85 + weatherFade * 0.40, 0, 1)
        #endif

        variable.float.morningMist = clamp(cos(newSunAngle) * (1.0 - absCelestialSinX * 2.2), 0, 1)
        variable.float.moisturePotential = clamp(weatherMoisture + morningMist * 0.45, 0, 1)
        variable.float.fogHumidityThreshold = (1.0 - smoothHumidity) * 0.70
        variable.float.fogProbabilityRaw = clamp((moisturePotential - fogHumidityThreshold) / max(smoothHumidity * 0.80 + 0.20, 0.01), 0, 1) * smoothHumidity
        variable.float.fogProbabilityShaped = fogProbabilityRaw * fogProbabilityRaw * (3 - 2 * fogProbabilityRaw)
        uniform.float.dynamicFog = smooth(fogProbabilityShaped, 20, 25)
    #else
        uniform.float.dynamicFog = 0.0
    #endif

    ## Cold biome detection (snowy precipitation, icy biomes, taiga, cold ocean, or cold temperature)
    variable.float.isColdOcean = if(in(biome, BIOME_COLD_OCEAN, BIOME_DEEP_COLD_OCEAN, BIOME_FROZEN_OCEAN, BIOME_DEEP_FROZEN_OCEAN), 1, 0)
    variable.float.isSnowIceBiome = if(in(biome_precipitation, 2) || in(biome_category, 1, 7) || isColdOcean > 0.5 || temperature < 0.35, 1, 0)
    uniform.float.isColdBiome = smooth(isSnowIceBiome, 25)
    uniform.float.smoothBiomeTemp = smooth(clamp(if(isColdOcean > 0.5, min(temperature, 0.42), temperature), -0.7, 1.0), 25)

    ## Pale garden biome detection
    variable.float.isPaleGardenBiome = if(in(biome, BIOME_PALE_GARDEN), 1, 0)
    uniform.float.isPaleGarden = smooth(isPaleGardenBiome, 25)

## Lightning flash calculation
    uniform.float.lightningFlash = lightningBoltPosition.w

## Frame Jitter Uniform
    uniform.int.frameMod = frameCounter % 8

    ## 0.125 * 1.61803399
    uniform.float.frameFract = frameMod * 0.20225425

## Other
    uniform.float.pixelWidth = 1 / viewWidth
    uniform.float.pixelHeight = 1 / viewHeight

    uniform.float.eyeSkylight = smooth(eyeBrightness.y / 240, 15)

    uniform.float.effectFactor = max(blindness, darknessFactor * 0.125 + darknessLightFactor)
    uniform.float.volumetricCloudFar = far * 8.0 * (1.0 - weatherFade * 0.5)

    ## uniform.float.maxResolution = max(viewWidth, viewHeight)
    ## uniform.float.minResolution = min(viewWidth, viewHeight)