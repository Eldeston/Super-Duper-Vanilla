## Profiles
profile.POTATO = !VOLUMETRIC_LIGHTING CLOUD_TYPE:1 !SHADOW_MAPPING !SHADOW_COLOR !SHADOW_FILTER !SSAO !ROUGH_REFLECTIONS !PREVIOUS_FRAME !SSR !BLOOM !SHARPEN_FILTER ANTI_ALIASING:1
profile.LOW = profile.POTATO SHADOW_MAPPING SSR RAYTRACER_STEPS:8 RAYTRACER_BISTEPS:2 BLOOM shadowMapResolution:512 UNDERWATER_CAUSTICS:0
profile.MEDIUM = profile.LOW VOLUMETRIC_LIGHTING CLOUD_TYPE:2 SHADOW_COLOR SHADOW_FILTER RAYTRACER_STEPS:16 RAYTRACER_BISTEPS:4 ROUGH_REFLECTIONS SSAO PREVIOUS_FRAME ANTI_ALIASING:2 shadowMapResolution:1024 UNDERWATER_CAUSTICS:1
profile.HIGH = profile.MEDIUM RAYTRACER_STEPS:32 shadowMapResolution:2048
profile.ULTRA = profile.HIGH RAYTRACER_STEPS:64 SHARPEN_FILTER shadowMapResolution:4096 UNDERWATER_CAUSTICS:2

## Main shader settings screen
screen = \
    [DEBUG] <profile> \
    <empty> <empty> \
    [POST] [LIGHTING] \
    [ATMOSPHERICS] [WORLD] \
    [PBR] [CONFIGURATION]

    ## Debug Screen
    screen.DEBUG = COLOR_MODE NOISE_SPEED

    ## Post Screen
    screen.POST = \
        OUTLINES OUTLINE_BRIGHTNESS \
        OUTLINE_PIXEL_SIZE RETRO_FILTER \
        <empty> <empty> \
        ANTI_ALIASING SHARPEN_FILTER \
        [CAMERA] [TONEMAP]

        ## Camera Screen
        screen.CAMERA = \
            DOF DOF_STRENGTH \
            CHROMATIC_ABERRATION ABERRATION_PIXEL_SIZE \
            BLOOM BLOOM_STRENGTH \
            <empty> <empty> \
            LENS_FLARE LENS_FLARE_STRENGTH \
            VIGNETTE VIGNETTE_STRENGTH \
            MOTION_BLUR MOTION_BLUR_STRENGTH

        ## Tonemap Screen
        screen.TONEMAP = \
            CONTRAST SATURATION \
            WHITE_POINT SHOULDER_STRENGTH \
            <empty> <empty> \
            AUTO_EXPOSURE AUTO_EXPOSURE_SPEED \
            EXPOSURE MINIMUM_EXPOSURE \
            <empty> <empty> \
            TINT_R TINT_G \
            TINT_B

    ## Lighting Screen
    screen.LIGHTING = \
        SHADOW_MAPPING SHADOW_COLOR \
        BLOCK_ENTITY_SHADOWS ENTITY_SHADOWS \
        SHADOW_FILTER shadowMapResolution \
        shadowDistance sunPathRotation \
        <empty> <empty> [RAY_TRACING] \
        UNDERWATER_CAUSTICS SSAO \
        AMBIENT_LIGHTING

        ## Ray Tracing Screen
        screen.RAY_TRACING = \
            SSGI SSR \
            RAYTRACER_STEPS RAYTRACER_BISTEPS \
            <empty> <empty> \
            ROUGH_REFLECTIONS PREVIOUS_FRAME

    ## Atmospherics Screen
    screen.ATMOSPHERICS = \
        SUN_MOON_TYPE SUN_MOON_INTENSITY \
        <empty> <empty> \
        VOLUMETRIC_LIGHTING VOLUMETRIC_LIGHTING_STRENGTH \
        BORDER_FOG GROUND_FOG_STRENGTH \
        <empty> <empty> \
        [CLOUD_SETTINGS] SKYBOX_BRIGHTNESS

        ## Cloud Screen
        screen.CLOUD_SETTINGS = \
            CLOUD_TYPE DOUBLE_LAYERED_CLOUDS \
            DYNAMIC_CLOUDS FADE_SPEED \
            SECOND_CLOUD_HEIGHT <empty> \
            <empty> <empty> \
            VOLUMETRIC_CLOUD_STEPS VOLUMETRIC_CLOUD_DEPTH \
            SKYBOX_CLOUD_STEPS SKYBOX_CLOUD_DEPTH

    # World Screen
    screen.WORLD = \
        TERRAIN_ANIMATION WATER_ANIMATION \
        WEATHER_ANIMATION TIMELAPSE_MODE \
        <empty> <empty> \
        WIND_SPEED CURRENT_SPEED \
        WIND_FREQUENCY CURRENT_FREQUENCY \
        <empty> <empty> \
        WORLD_CURVATURE WORLD_CURVATURE_SIZE

    # PBR Screen
    screen.PBR = \
        PBR_MODE SPECULAR_HIGHLIGHTS \
        ENVIRONMENT_PBR SUBSURFACE_SCATTERING \
        EMISSIVE_INTENSITY NORMAL_STRENGTH \
        <empty> <empty> \
        [POM_SETTINGS] [IPBR_SETTINGS] \
        DIRECTIONAL_LIGHTMAPS DIRECTIONAL_LIGHTMAP_STRENGTH \
        SLOPE_NORMALS

        # POM Settings Screen
        screen.POM_SETTINGS = \
            PARALLAX_OCCLUSION PARALLAX_DEPTH \
            PARALLAX_STEPS <empty> \
            <empty> <empty> \
            PARALLAX_SHADOW PARALLAX_SHADOW_STEPS

        # iPBR Settings Screen
        screen.IPBR_SETTINGS = \
            [WATER_SETTINGS] [LAVA_SETTINGS] \
            [SCULK_SETTINGS] <empty> \
            <empty> <empty> \
            NORMAL_GENERATION NORMAL_GENERATION_RESOLUTION

            # Water Settings Screen
            screen.WATER_SETTINGS = \
                WATER_NOISE WATER_BRIGHTNESS \
                <empty> <empty> \
                WATER_NORMAL WATER_BLUR_SIZE \
                WATER_DEPTH_SIZE WATER_TILE_SIZE \
                <empty> <empty> \
                WATER_STYLIZE_ABSORPTION WATER_FOAM \
                WATER_FLAT

            # Lava Settings Screen
            screen.LAVA_SETTINGS = \
                LAVA_BRIGHTNESS LAVA_NOISE \
                LAVA_TILE_SIZE
            
            # Sculk Settings Screen
            screen.SCULK_SETTINGS = \
                SCULK_BRIGHTNESS SCULK_NOISE \
                SCULK_TILE_SIZE

    # Configuration Screen
    screen.CONFIGURATION = \
        [OVERWORLD_SETTINGS] [NETHER_SETTINGS] \
        [END_SETTINGS] <empty> \
        <empty> <empty> \
        [BLOCK_LIGHT_COLOR]

        # Overworld Settings Screen
        screen.OVERWORLD_SETTINGS = \
            [DAY_SETTINGS] [NIGHT_SETTINGS] \
            [TWILIGHT_SETTINGS] [FOG_SETTINGS0]

            # Day Settings Screen
            screen.DAY_SETTINGS = \
                LIGHT0_DR LIGHT0_DG \
                LIGHT0_DB LIGHT0_DI \
                <empty> <empty> \
                SKY0_DR SKY0_DG \
                SKY0_DB SKY0_DI

            # Night Settings Screen
            screen.NIGHT_SETTINGS = \
                LIGHT0_NR LIGHT0_NG \
                LIGHT0_NB LIGHT0_NI \
                <empty> <empty> \
                SKY0_NR SKY0_NG \
                SKY0_NB SKY0_NI

            # Twilight Settings Screen
            screen.TWILIGHT_SETTINGS = \
                LIGHT0_TR LIGHT0_TG \
                LIGHT0_TB LIGHT0_TI \
                <empty> <empty> \
                SKY0_TR SKY0_TG \
                SKY0_TB SKY0_TI

            # Fog Settings Screen
            screen.FOG_SETTINGS0 = \
                FOG0_VERTICAL_DENSITY_D FOG0_VERTICAL_DENSITY_N \
                FOG0_VERTICAL_DENSITY_T <empty> \
                <empty> <empty> \
                FOG0_TOTAL_DENSITY

        # Nether Settings Screen
        screen.NETHER_SETTINGS = \
            FOGn1_VERTICAL_DENSITY FOGn1_TOTAL_DENSITY \
            <empty> <empty> \
            WORLDn1_VANILLA_FOGCOLI

        # End Settings Screen
        screen.END_SETTINGS = \
            LIGHT1_CR LIGHT1_CG \
            LIGHT1_CB LIGHT1_CI \
            <empty> <empty> \
            SKY1_CR SKY1_CG \
            SKY1_CB SKY1_CI \
            <empty> <empty> \
            FOG1_VERTICAL_DENSITY FOG1_TOTAL_DENSITY

        # Overworld block light color Screen
        screen.BLOCK_LIGHT_COLOR = \
            BLOCKLIGHT_R BLOCKLIGHT_G \
            BLOCKLIGHT_B BLOCKLIGHT_I

